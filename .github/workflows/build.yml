name: Build and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  mcm-test-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/checkout@v4
        with:
          repository: schlangster/skyui
          path: tools/skyui-sdk
      - name: Compile Papyrus MCM and native declarations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/papyrus-headers package/Data/Scripts tools/papyrus-compiler-v/bin
          cp tools/skyui-sdk/dist/Data/Scripts/Headers/*.psc build/papyrus-headers/
          cp papyrus/headers/*.psc build/papyrus-headers/
          curl -fsSL https://github.com/russo-2025/papyrus-compiler/releases/download/2026.03.15/papyrus-compiler-ubuntu.tar.gz -o /tmp/papyrus-compiler.tar.gz
          echo "Compiler archive contents:"
          tar -tzf /tmp/papyrus-compiler.tar.gz | head -30
          tar -xzf /tmp/papyrus-compiler.tar.gz -C tools/papyrus-compiler-v/bin
          echo "Extracted compiler files:"
          find tools/papyrus-compiler-v/bin -maxdepth 3 -type f -print
          compiler="$(find tools/papyrus-compiler-v/bin -type f -iname papyrus -print -quit)"
          if [ -z "$compiler" ]; then
            compiler="$(find tools/papyrus-compiler-v/bin -type f -iname '*papyrus*compiler*' -print -quit)"
          fi
          if [ -z "$compiler" ]; then echo 'Papyrus compiler executable was not found in the release archive.'; exit 1; fi
          chmod +x "$compiler"
          "$compiler" help
          "$compiler" compile -nocache -h build/papyrus-headers -i papyrus/JGJGTransmogNative.psc -o package/Data/Scripts
          "$compiler" compile -nocache -h build/papyrus-headers -i papyrus/JGJGTransmogMCM.psc -o package/Data/Scripts
          python3 - <<'PY'
          from pathlib import Path
          for name in ('JGJGTransmogNative.pex', 'JGJGTransmogMCM.pex'):
              p = Path('package/Data/Scripts') / name
              if not p.is_file() or p.read_bytes()[:4] != bytes.fromhex('fa57c0de'):
                  raise SystemExit(f'Papyrus compile did not produce a valid {name}')
          PY
      - name: Generate ESL-flagged ESP MCM quest
        run: dotnet run --project tools/McmPluginGen/McmPluginGen.csproj --configuration Release -- package/Data/JGJGsTransmogSystem.esp
      - uses: actions/upload-artifact@v4
        with:
          name: JGJGs-Transmog-System-MCM-assets
          path: package/Data/*
          if-no-files-found: error
  core-and-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test portable core
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Package source
        run: python3 tools/package.py --mode source
      - uses: actions/upload-artifact@v4
        with:
          name: JGJGs-Transmog-System-source
          path: dist/*
          if-no-files-found: error
  windows-prototype:
    needs: [mcm-test-assets]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JGJGs-Transmog-System-MCM-assets
          path: package/Data
      - name: Configure Windows x64 SKSE component
        shell: pwsh
        run: >-
          cmake -S . -B build -A x64
          -DJGJG_BUILD_SKSE=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
      - name: Compile
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package developer component (not a playable mod)
        run: python tools/package.py --mode developer --stage build/Release
      - name: Stage Windows DLL for MCM test archive
        shell: pwsh
        run: |
          $dll = "build/Release/JGJGsTransmogSystem.dll"
          if (!(Test-Path $dll)) { throw "Compiled DLL missing: $dll" }
          New-Item -ItemType Directory -Force -Path "package/Data/SKSE/Plugins" | Out-Null
          Copy-Item $dll "package/Data/SKSE/Plugins/JGJGsTransmogSystem.dll" -Force
      - name: Package in-game armor render test (not a complete transmog mod)
        run: python tools/package.py --mode mcm-test --stage package/Data
      - uses: actions/upload-artifact@v4
        with:
          name: JGJGs-Transmog-System-ARMOR-TEST-ONLY
          path: dist/*
          if-no-files-found: error
  release-source:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core-and-source, windows-prototype]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: JGJGs-Transmog-System-source
          path: dist
      - name: Publish clearly labelled source prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" dist/*
          --verify-tag --prerelease
          --title "JGJGs Transmog System $RELEASE_TAG — source preview"
          --notes-file docs/SOURCE-RELEASE.md
